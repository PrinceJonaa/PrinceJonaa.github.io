name: JonaAudio licensed full-song tempo metadata probe
on:
  pull_request:
    paths:
      - 'JonaAudio/bench/probe-mshoxxdb.py'
      - '.github/workflows/jonaaudio-fullsong-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check remotezip==0.12.3
      - run: python -u JonaAudio/bench/probe-mshoxxdb.py
