name: JonaAudio full-song FMAK rights audit
on:
  pull_request:
    paths:
      - 'JonaAudio/bench/audit-fmak-licenses.py'
      - '.github/workflows/jonaaudio-fmak-license-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install range reader for FMA archive metadata only
        run: python -m pip install --disable-pip-version-check remotezip==0.12.3
      - name: Verify expert key annotations against each original song's actual license
        run: python -u JonaAudio/bench/audit-fmak-licenses.py
      - name: Preserve metadata-only license audit, not copyrighted audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FMAK-expert-key-and-audio-license-audit
          path: JonaAudio/bench/fixtures/FMAK/license-audit.json
          if-no-files-found: warn
