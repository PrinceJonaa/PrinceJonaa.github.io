name: JonaAudio real CC BY GuitarSet fixtures
on:
  pull_request:
    paths:
      - 'JonaAudio/bench/build-guitarset-fixtures.py'
      - 'JonaAudio/bench/run-guitarset.mjs'
      - '.github/workflows/jonaaudio-guitarset-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire-and-evaluate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/jonaaudio-guitarset-ccby-20261025')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jonaaudio-guitarset-ccby-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check real-fixture builder and runner syntax
        run: |
          python -m py_compile JonaAudio/bench/build-guitarset-fixtures.py
          node --check JonaAudio/bench/run-guitarset.mjs
      - name: Use bounded remote ZIP extraction when source supports ranges
        run: pip install --disable-pip-version-check remotezip==0.12.3
      - name: Download source annotations and selected CC BY 4.0 audio; save credit
        run: |
          python -u JonaAudio/bench/build-guitarset-fixtures.py --count 8 --output JonaAudio/bench/fixtures/GuitarSet
      - name: Test actual annotated key, scale-note and tempo results
        run: |
          node JonaAudio/bench/run-guitarset.mjs JonaAudio/bench/fixtures/GuitarSet
      - name: Assert public fixture attribution and dataset metadata
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('JonaAudio/bench/fixtures/GuitarSet')
          m=json.loads((root/'manifest.json').read_text())
          assert m['license']=='CC BY 4.0' and m['doi']=='10.5281/zenodo.3371780'
          assert len(m['tracks'])==8
          assert all((root/t['file']).is_file() and t['source_wav_sha256'] and t['fixture_sha256'] for t in m['tracks'])
          assert (root/'CREDITS.md').is_file() and (root/'benchmark-results.json').is_file()
          print('GuitarSet fixtures and real benchmark provenance verified')
          PY
      - name: Preserve real legal audio and metrics as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JonaAudio-GuitarSet-CCBY-8-real-songs-and-benchmark
          path: JonaAudio/bench/fixtures/GuitarSet/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit only attributed licensed fixtures and numerical report to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JonaAudio/bench/fixtures/GuitarSet
          if git diff --cached --quiet; then
            echo "Fixtures and metrics already committed"
          else
            git commit -m "JonaAudio: preserve eight CC BY GuitarSet recordings and actual ground-truth key/BPM scores"
            git push origin HEAD:refs/heads/feat/jonaaudio-guitarset-ccby-20261025
          fi
