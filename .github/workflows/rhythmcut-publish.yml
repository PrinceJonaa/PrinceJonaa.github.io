name: Publish RhythmCut to princejona.me

# The public website is GitHub Pages (classic, main branch).
# GITHUB_TOKEN commits alone do NOT start a classic Pages build. Request one
# explicitly after syncing, so unattended updates really reach the domain.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rhythmcut-publish.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

env:
  RHYTHMCUT_SOURCE_REF: codex/timeline-studio
  VITE_API_ORIGIN: https://rhythmcut-timeline-studio.vercel.app
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_SENTRY_ENVIRONMENT: production

concurrency:
  group: rhythmcut-public-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Check upstream source against published release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          mode="$(node -e "try{console.log(require('./rhythmcut/release.json').publicationMode||'upstream')}catch{console.log('upstream')}")"
          if [[ "$mode" == 'pinned' ]]; then
            # A reviewed static release can come from a private source repo.
            # Keep that release without requesting broader GitHub credentials.
            node -e "const r=require('./rhythmcut/release.json');if(r.sourceRef!==process.env.RHYTHMCUT_SOURCE_REF||!/^[a-f0-9]{40}$/.test(r.commit))process.exit(1);console.log('Keeping pinned '+r.edition+' release '+r.commit)"
            test -s rhythmcut/index.html
            test -s rhythmcut/coi-serviceworker.js
            test -s rhythmcut/fonts/BarlowCondensed-SemiBold.ttf
            echo 'needs_build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_sha="$(git ls-remote https://github.com/PrinceJonaa/rhythmcut.git "refs/heads/$RHYTHMCUT_SOURCE_REF" | cut -f1)"
          test "${#source_sha}" -eq 40
          published_sha="$(node -e "try{console.log(require('./rhythmcut/release.json').commit||'')}catch{console.log('')}")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$source_sha" == "$published_sha" ]] && [[ -s rhythmcut/index.html ]] && [[ -s rhythmcut/coi-serviceworker.js ]]; then
            echo 'needs_build=false' >> "$GITHUB_OUTPUT"
            echo "RhythmCut is already synced to source $source_sha"
          else
            echo 'needs_build=true' >> "$GITHUB_OUTPUT"
            echo "Upstream=$source_sha, public=$published_sha"
          fi

      - name: Check out upstream RhythmCut
        if: steps.upstream.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RHYTHMCUT_SOURCE_REF" https://github.com/PrinceJonaa/rhythmcut.git "$RUNNER_TEMP/rhythmcut-source"
          git -C "$RUNNER_TEMP/rhythmcut-source" rev-parse HEAD > "$RUNNER_TEMP/rhythmcut-source-sha"

      - uses: actions/setup-node@v4
        if: steps.upstream.outputs.needs_build == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/rhythmcut-source/package-lock.json

      - name: Install, typecheck and unit-test upstream
        if: steps.upstream.outputs.needs_build == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/rhythmcut-source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Build Timeline Studio web assets
        if: steps.upstream.outputs.needs_build == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/rhythmcut-source
        run: |
          set -euo pipefail
          export VITE_SENTRY_RELEASE="rhythmcut@$(cat "$RUNNER_TEMP/rhythmcut-source-sha")"
          npm run build
          test -s dist/index.html
          test -s dist/coi-serviceworker.js
          test -s dist/vision/wasm/vision_wasm_module_internal.wasm
          test -s dist/vision/blaze_face_short_range.tflite
          test -s dist/fonts/BarlowCondensed-SemiBold.ttf
          test -s dist/site.webmanifest
          du -sh dist

      - name: Stage only /rhythmcut/ and verify host shell
        if: steps.upstream.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/app-return.js
          test -s assets/app-return.css
          mkdir -p rhythmcut
          rsync -a --delete --exclude='release.json' "$RUNNER_TEMP/rhythmcut-source/dist/" rhythmcut/
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          from datetime import datetime, timezone
          page=Path('rhythmcut/index.html')
          html=page.read_text()
          shell='<script type="module" src="/assets/app-return.js"></script>'
          if shell not in html:
              assert '</body>' in html, 'Built index.html has no body close'
              html=html.replace('</body>',shell+'</body>')
          assert '/rhythmcut/assets/' in html, 'Incorrect Vite base path'
          page.write_text(html)
          src=Path(os.environ['RUNNER_TEMP'])/'rhythmcut-source'
          version=json.loads((src/'package.json').read_text())['version']
          commit=(Path(os.environ['RUNNER_TEMP'])/'rhythmcut-source-sha').read_text().strip()
          release={
            'app':'RhythmCut',
            'version':version,
            'source':'https://github.com/PrinceJonaa/rhythmcut',
            'sourceRef':os.environ['RHYTHMCUT_SOURCE_REF'],
            'commit':commit,
            'path':'/rhythmcut/',
            'builtAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'testing':'typecheck, unit tests and production build passed',
            'publisher':'GitHub Actions: rhythmcut-publish.yml'
          }
          Path('rhythmcut/release.json').write_text(json.dumps(release,indent=2)+'\n')
          assert Path('rhythmcut/coi-serviceworker.js').stat().st_size>500
          print(f'Staged RhythmCut {version} at {commit}')
          PY
          git status --short rhythmcut | head -35

      - name: Commit latest static build to website main
        if: steps.upstream.outputs.needs_build == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A rhythmcut/
          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(cat "$RUNNER_TEMP/rhythmcut-source-sha")"
          git commit -m "Publish RhythmCut from upstream ${sha:0:12} [automated]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
          echo "Published upstream $sha into GitHub Pages branch"

      - name: Explicitly request classic GitHub Pages rebuild
        # Unlike regular human pushes, bot pushes do not trigger classic Pages.
        # The REST Pages build API supports GITHUB_TOKEN pages:write.
        if: steps.commit.outputs.published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --retry-delay 5 --retry-all-errors -sSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            -o /tmp/pages-build.json
          cat /tmp/pages-build.json
          echo "Requested GitHub Pages refresh for /rhythmcut/"
