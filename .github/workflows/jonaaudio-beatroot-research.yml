name: JonaAudio permissive BeatRoot tempo comparator (MIT research)
on:
  pull_request:
    paths:
      - 'JonaAudio/bench/compare-waivops-beatroot.mjs'
      - '.github/workflows/jonaaudio-beatroot-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg and MIT-only BeatRoot in isolated research directory
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/jona-beatroot
          npm install --prefix /tmp/jona-beatroot --no-save --ignore-scripts music-tempo@1.0.3
      - name: Evaluate independently labeled rhythm loops with permissive algorithm
        env:
          BEATROOT_PACKAGE: /tmp/jona-beatroot/node_modules/music-tempo
        run: node JonaAudio/bench/compare-waivops-beatroot.mjs
      - name: Keep numerical results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WaivOps-MIT-BeatRoot-tempo-comparison
          path: JonaAudio/bench/fixtures/WaivOps/music-tempo-results.json
          if-no-files-found: warn
