name: JonaAudio P0/P2 accuracy diagnostics
on:
  pull_request:
    paths:
      - 'JonaAudio/**'
      - '.github/workflows/jonaaudio-accuracy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Test correctness, fallback and private WAV decoder
        run: node --test JonaAudio/tests/harmonic-key.test.mjs JonaAudio/tests/benchmark-local.test.mjs JonaAudio/tests/readiness.test.mjs JonaAudio/tests/tempo-crosscheck.test.mjs JonaAudio/tests/bass-evidence.test.mjs JonaAudio/tests/tempo-midi.test.mjs JonaAudio/tests/labeled-scoring.test.mjs
      - name: Validate optional local reference-engine Python script syntax
        run: python3 -m py_compile JonaAudio/bench/reference-engines.py
      - name: Run deterministic synthetic-only key/BPM comparison
        run: node JonaAudio/bench/compare.mjs /tmp/jonaaudio-synthetic.json
      - name: Preserve metric report only (not source audio)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jonaaudio-synthetic-metrics
          path: /tmp/jonaaudio-synthetic.json
          if-no-files-found: ignore
