name: JonaAudio FSLD expert BPM and licenses probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check remotezip==0.12.3
      - name: Read small published expert labels and large archive central directory via HTTP Range
        run: python -u JonaAudio/bench/probe-fsld.py
