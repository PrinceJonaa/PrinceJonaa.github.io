name: JonaAudio Essentia.js WASM research parity (AGPL, isolated)
on:
  pull_request:
    paths:
      - 'JonaAudio/bench/compare-waivops-wasm.mjs'
      - '.github/workflows/jonaaudio-wasm-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install decoder plus isolated upstream AGPL WASM package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/jona-essentia-wasm
          npm install --prefix /tmp/jona-essentia-wasm --no-save --ignore-scripts essentia.js@0.1.3
      - name: Validate actual Essentia.js RhythmExtractor2013 WASM parity on 21 license-verified loops
        env:
          ESSENTIA_PACKAGE: /tmp/jona-essentia-wasm/node_modules/essentia.js
        run: node JonaAudio/bench/compare-waivops-wasm.mjs
      - name: Save metadata and numeric parity results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JonaAudio-EssentiaJS-WASM-research-only
          path: JonaAudio/bench/fixtures/WaivOps/essentiajs-results.json
          if-no-files-found: warn
