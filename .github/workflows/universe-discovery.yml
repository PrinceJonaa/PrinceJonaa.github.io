name: Universe acceptance
on:
  push:
    branches: [main, feat/universe-s0-s1, feat/universe-s1-s2]
    paths: ['assets/**', 'tests/**', 'scripts/**', '*.html', 'apps/**', 'atlas/**', 'music/**', 'work/**', 'services/**', 'beatcut/**', 'supabase/**', 'cloudflare/**', 'about/**', 'operations/**', 'craft/**', 'rhythmcut/index.html', 'JonaAudio/**', 'records/**', '.github/workflows/universe-discovery.yml', '.node-version', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['assets/**', 'tests/**', 'scripts/**', '*.html', 'apps/**', 'atlas/**', 'music/**', 'work/**', 'services/**', 'beatcut/**', 'supabase/**', 'about/**', 'operations/**', 'craft/**', 'rhythmcut/index.html', 'JonaAudio/**', 'records/**', '.github/workflows/universe-discovery.yml', '.node-version', 'package.json', 'package-lock.json']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Public catalog and JonaAudio regressions
        run: |
          node --test tests/*.test.mjs JonaAudio/tests/*.test.mjs
          node records/jona-52/tests/m1-m2.smoke.mjs
      - name: Browser runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Consolidated browser acceptance
        run: |
          node tests/universe-browser.cjs
      - name: Prepared inquiry schema and private permissions
        run: node tests/inquiry-db.cjs
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: universe-discovery-evidence
          path: |
            /tmp/universe-http.log
            /tmp/universe-*.png
          if-no-files-found: ignore
