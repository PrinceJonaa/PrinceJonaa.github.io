name: Universe acceptance
on:
  push:
    branches: [main, feat/universe-s0-s1, feat/universe-s1-s2]
    paths: ['assets/**', 'tests/**', 'scripts/**', '*.html', 'apps/**', 'atlas/**', 'music/**', 'work/**', 'services/**', 'beatcut/**', 'supabase/**', 'about/**', 'operations/**', 'craft/**', 'rhythmcut/index.html', 'JonaAudio/**', '.github/workflows/universe-discovery.yml']
  pull_request:
    paths: ['assets/**', 'tests/**', 'scripts/**', '*.html', 'apps/**', 'atlas/**', 'music/**', 'work/**', 'services/**', 'beatcut/**', 'supabase/**', 'about/**', 'operations/**', 'craft/**', 'rhythmcut/index.html', 'JonaAudio/**', '.github/workflows/universe-discovery.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public catalog and JonaAudio regressions
        run: node --test tests/*.test.mjs JonaAudio/tests/*.test.mjs
      - name: Browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 @electric-sql/pglite@0.5.9
          npx playwright install --with-deps chromium
      - name: Consolidated browser acceptance
        run: |
          node tests/universe-browser.cjs
      - name: Prepared inquiry schema and private permissions
        run: node tests/inquiry-db.cjs
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-discovery-evidence
          path: |
            /tmp/universe-http.log
            /tmp/universe-*.png
          if-no-files-found: ignore
