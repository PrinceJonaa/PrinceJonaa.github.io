name: JonaAudio acquire CC BY hip-hop rhythm examples (one-time)
on:
  pull_request:
    paths:
      - 'JonaAudio/bench/build-waivops-fixtures.py'
      - 'JonaAudio/bench/run-waivops.mjs'
      - '.github/workflows/jonaaudio-waivops-acquire.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/jonaaudio-rhythm-holdout-20261025')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jonaaudio-rhythm-holdout-20261025
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline MP3 decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate scripts before accessing music files
        run: |
          python -m py_compile JonaAudio/bench/build-waivops-fixtures.py
          node --check JonaAudio/bench/run-waivops.mjs
      - name: Download 21 original CC BY 4.0 audio recordings from WaivOps GitHub
        run: |
          python -u JonaAudio/bench/build-waivops-fixtures.py
      - name: Evaluate source-labeled tempo, keep development and held-out split distinct
        run: node JonaAudio/bench/run-waivops.mjs
      - name: Verify fixture license attribution and metadata
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          d=pathlib.Path('JonaAudio/bench/fixtures/WaivOps')
          m=json.loads((d/'manifest.json').read_text())
          r=json.loads((d/'benchmark-results.json').read_text())
          assert m['license']=='CC BY 4.0'
          assert len(m['tracks'])==len(r['rows'])==21
          assert all((d/t['file']).is_file() and hashlib.sha256((d/t['file']).read_bytes()).hexdigest()==t['sha256'] for t in m['tracks'])
          assert {t['split'] for t in m['tracks']}=={'development','held-out'}
          assert {t['genreGroup'] for t in m['tracks']}=={'trap','boom-bap'}
          assert (d/'CREDITS.md').exists()
          print('Verified 21 source audio hashes, license metadata and split integrity')
          PY
      - name: Preserve source audio, source labels and scored report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JonaAudio-WaivOps-CCBY-rhythm-corpus
          path: JonaAudio/bench/fixtures/WaivOps/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit attributed audio corpus and numerical results to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JonaAudio/bench/fixtures/WaivOps/
          if git diff --cached --quiet; then
            echo "No new licensed files"
          else
            git commit -m "JonaAudio: save 21 CC BY hip-hop drum loops and original BPM benchmark"
            git push origin HEAD:refs/heads/feat/jonaaudio-rhythm-holdout-20261025
          fi
