name: Expand verified RhythmCut release
on:
  push:
    branches: [rhythmcut-release-0-4-0]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify exact CI files
        run: |
          python - <<'PY'
          import pathlib, json, hashlib, gzip, io, tarfile, shutil
          payload = pathlib.Path('.rhythmcut-release-staging')
          expected = {x['path']: x['sha'] for x in json.loads((payload / 'manifest.json').read_text())}
          packed = b''.join(p.read_bytes() for p in sorted(payload.glob('part-*')))
          archive = tarfile.open(fileobj=io.BytesIO(gzip.decompress(packed)), mode='r:')
          members = archive.getmembers()
          assert {x.name for x in members} == set(expected), 'Unexpected archive files'
          assert all(x.isfile() and not pathlib.PurePosixPath(x.name).is_absolute() and '..' not in pathlib.PurePosixPath(x.name).parts for x in members)
          for member in members:
              data = archive.extractfile(member).read()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected[member.name], member.name
          target = pathlib.Path('rhythmcut')
          shutil.rmtree(target)
          target.mkdir()
          archive.extractall(target, filter='data')
          assert {p.relative_to(target).as_posix() for p in target.rglob('*') if p.is_file()} == set(expected)
          release = json.loads((target / 'release.json').read_text())
          assert release['commit'] == '7cd6cb38cdffad993b8734cad29e8b9c37ffc06d'
          shutil.rmtree(payload)
          pathlib.Path('.github/workflows/rhythmcut-expand-release.yml').unlink()
          print('Verified all', len(expected), 'release files:', release['commit'])
          PY
      - name: Commit expanded release to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish verified RhythmCut v0.4.0 from 7cd6cb3"
          git push origin HEAD:refs/heads/rhythmcut-release-0-4-0
