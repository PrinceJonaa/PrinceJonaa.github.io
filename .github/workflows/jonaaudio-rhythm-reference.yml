name: JonaAudio research — independent hip-hop tempo engines
on:
  pull_request:
    paths:
      - 'JonaAudio/bench/compare-waivops-reference.py'
      - '.github/workflows/jonaaudio-rhythm-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline decoder and public scientific-audio reference packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'librosa==0.11.0'
      - name: Try optional AGPL Essentia only in CI research environment
        run: |
          if python -m pip install --disable-pip-version-check essentia; then
            echo "Essentia comparator installed"
          else
            echo "Essentia unavailable; do not invent results"
          fi
      - name: Compare JonaAudio with actual independent librosa and optional Essentia beat trackers
        run: |
          python -u JonaAudio/bench/compare-waivops-reference.py --essentia
      - name: Preserve numerical research results, not audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WaivOps-independent-BPM-comparison
          path: JonaAudio/bench/fixtures/WaivOps/reference-engine-results.json
          if-no-files-found: warn
