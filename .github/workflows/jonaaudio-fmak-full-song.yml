name: JonaAudio expert full-song key benchmark (FMAK, licensed only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licensed-full-song-key:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install decoder and ZIP range reader
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check remotezip==0.12.3
      - name: Verify expert FMAK annotations against each artist's CC license
        run: python -u JonaAudio/bench/audit-fmak-licenses.py
      - name: Extract a few genuine complete songs with verified license from original FMAK archive
        run: python -u JonaAudio/bench/fetch-fmak-licensed-audio.py
      - name: Compare expert key labels with the actual JonaAudio analysis engine
        run: node JonaAudio/bench/run-fmak-full-songs.mjs
      - name: Install AGPL Essentia only for independent full-song key research
        run: python -m pip install --disable-pip-version-check essentia numpy
      - name: Compare Essentia HPCP song-level key candidates to fixed expert annotations
        run: python -u JonaAudio/bench/compare-fmak-essentia.py
      - name: Inspect report and prevent fabricated label-only 'accuracy'
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('JonaAudio/bench/fixtures/FMAK')
          a=json.loads((p/'license-audit.json').read_text())
          r=json.loads((p/'full-song-results.json').read_text())
          assert a['stats']['totalFmakKeys'] == 5489
          assert r['score']['all']['count']>=5
          assert all(x['fullSongSeconds']>=50 for x in r['rows'])
          assert all(x['originalLicense'].startswith('Attribution') for x in r['rows'])
          print('Verified number of expert full-song annotated keys:',r['score'])
          PY
      - name: Save numeric results and source attribution only, never copyrighted MP3 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JonaAudio-FMAK-rights-checked-full-song-key-results
          path: |
            JonaAudio/bench/fixtures/FMAK/license-audit.json
            JonaAudio/bench/fixtures/FMAK/selection.json
            JonaAudio/bench/fixtures/FMAK/full-song-results.json
            JonaAudio/bench/fixtures/FMAK/essentia-key-results.json
          if-no-files-found: warn
