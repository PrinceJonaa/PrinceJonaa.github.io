<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightCraft</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="LightCraft: open-source photo library and raw developer, running in your browser (WASM).">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>

  <style>
    #craft-storage-launch { position:fixed; right:14px; bottom:14px; z-index:2147483647;
      border:1px solid #424852; border-radius:999px; background:#12151bea; color:#d2fd76;
      padding:9px 13px; text-decoration:none; font:600 12px/1.3 system-ui,sans-serif;
      box-shadow:0 2px 12px #0007; }
    #craft-storage-launch:hover,#craft-storage-launch:focus-visible { border-color:#d2fd76; background:#20262b; }
    @media(max-width:500px) { #craft-storage-launch { padding:7px 9px; right:8px; bottom:8px; } }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start, command } from "./lightcraft_web.js";
    (async () => {
      // Compile once; the render workers (worker.js) instantiate the same compiled module.
      const module = await WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm"));
      globalThis.lightcraftModule = module;
      await init({ module_or_path: module });
      // automation: `await lightcraft.command("library.info", "{}")` → JSON text
      globalThis.lightcraft = { command };
      start();
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "LightCraft failed to load: " + e;
    });
  </script>

  <a id="craft-storage-launch" href="../storage/" target="_blank" rel="noopener noreferrer" aria-label="Open Craft Storage Manager and backup tools">☁ Storage</a>
</body>
</html>
